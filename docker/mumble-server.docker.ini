# Mumble server configuration for the container image.
#
# On first run the entrypoint copies this file to /data/mumble-server.ini if that does not yet exist.
# Edit the copy inside your mounted /data volume (NOT this baked-in default) and restart the container to
# apply changes. Every setting Mumble supports is documented in the full sample at
# auxiliary_files/mumble-server.ini in the source tree.

# Keep all server state - the database, and the self-signed certificate Mumble auto-generates and stores
# in it - inside the mounted /data volume so it survives container recreation.
database=/data/mumble-server.sqlite

# Empty: log to the container's stdout/stderr, so `docker logs` shows the server log. Set a path under
# /data if you would rather keep a log file in the volume.
logfile=

# The port the image publishes (64738/tcp for control, 64738/udp for voice+video). Change here AND in your
# `docker run -p` / compose mapping if you move it.
port=64738

# Run the server process as the unprivileged in-image 'mumble' user. The entrypoint starts as root only to
# seed this file and make /data writable, then the server drops to this user. Clear it if you already run
# the container as a non-root user yourself.
uname=mumble

# ZeroC Ice RPC, bound to loopback inside the container only (not published). Set icesecretwrite below and
# publish/forward the port yourself if you actually drive the server over Ice (mumo, MuMo modules).
ice="tcp -h 127.0.0.1 -p 6502"
#icesecretwrite=

# A sensible default welcome message; change it for your community.
welcometext="<br />Welcome to this <b>Mumble</b> server (video-enabled fork).<br />"
