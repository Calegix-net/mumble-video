# Builds both release artifacts on every push: the Linux client bundle and the Windows MSI.
#
# Both jobs run in the same containers the maintainers build in locally (docker/Dockerfile and
# docker/Dockerfile.windows), so CI green means "the documented environment works", not "some runner
# image happened to have the right libraries". The images take a while to build cold; the registry
# cache keeps warm runs reasonable.
#
# A tag starting with v additionally publishes a GitHub release carrying both artifacts and their
# checksums.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual trigger, for re-running without an artificial commit and for the first run if the org's
  # Actions policy was enabled after the initial push.
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the build image
        run: docker build -t mumble-build -f docker/Dockerfile docker/

      - name: Configure, build and test
        run: |
          # Pre-created so docker does not create them root-owned: the zip step below runs as the
          # unprivileged runner user and must be able to write here.
          mkdir -p build out
          docker run --rm -v "$PWD":/src -v "$PWD/build":/build mumble-build bash -c '
            set -e
            cmake -S /src -B /build -DCMAKE_BUILD_TYPE=Release -Dtests=ON -Dice=OFF -Doverlay-xcompile=OFF
            cmake --build /build -j"$(nproc)"
            cd /build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure'

      - name: Bundle
        run: |
          docker run --rm -v "$PWD":/src -v "$PWD/build":/build -v "$PWD/out":/out mumble-build \
            bash /src/scripts/bundle-linux.sh /build /out/bundle
          cd out && zip -q -r -9 mumble-video-linux-x86_64.zip bundle

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-video-linux-x86_64
          path: out/mumble-video-linux-x86_64.zip

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the cross-build image
        run: docker build -t mumble-build-windows -f docker/Dockerfile.windows docker/

      - name: Cross-compile
        run: |
          mkdir -p build-win out
          docker run --rm -v "$PWD":/src -v "$PWD/build-win":/build mumble-build-windows \
            bash /src/scripts/build-windows.sh

      - name: Bundle and build the MSI
        run: |
          docker run --rm -v "$PWD":/src -v "$PWD/build-win":/build -v "$PWD/out":/out mumble-build-windows bash -c '
            set -e
            bash /src/scripts/bundle-windows.sh /build /out/mumble-windows
            bash /src/scripts/build-msi.sh /out/mumble-windows /out/mumble-video-x64.msi'
          cd out && zip -q -r -9 mumble-video-windows-x86_64.zip mumble-windows

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-video-windows-x86_64
          path: |
            out/mumble-video-x64.msi
            out/mumble-video-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum mumble-video-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mumble-video-linux-x86_64.zip
            mumble-video-x64.msi
            mumble-video-windows-x86_64.zip
            SHA256SUMS
