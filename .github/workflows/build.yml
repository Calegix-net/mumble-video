# Builds every release artifact on every push: the Linux bundle, the Linux flatpak, and the Windows
# installers.
#
# Every job runs in the same container the maintainers build in locally (docker/Dockerfile,
# docker/Dockerfile.windows, docker/Dockerfile.flatpak), so CI green means "the documented environment
# works", not "some runner image happened to have the right libraries". The images take a while to
# build cold; the layer cache keeps warm runs reasonable.
#
# Every push to main rolls the dev-latest prerelease; a tag starting with v publishes a versioned
# release. Both carry all artifacts and their checksums.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual trigger, for re-running without an artificial commit and for the first run if the org's
  # Actions policy was enabled after the initial push.
  workflow_dispatch:

# Stacked pushes to the same branch supersede each other rather than queueing a cold build apiece.
# Tag runs are exempt from cancellation: a release must never be killed by an unrelated push landing
# while it builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing the server container image to this repo's GHCR namespace.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image builds are most of a cold run's wall time and identical between runs, so their
      # layers are cached in the Actions cache. mode=max includes intermediate layers - the ones that
      # actually cost, like the from-source dependency builds.
      - uses: docker/setup-buildx-action@v3

      - name: Build the build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          tags: mumble-build
          load: true
          cache-from: type=gha,scope=linux-image
          cache-to: type=gha,scope=linux-image,mode=max

      # What the build reports itself as: the release on a tag, the last release plus -dev and the commit
      # otherwise. Worked out here because the checkout is shallow and only the runner can ask the remote
      # for tags.
      - name: Release version
        run: |
          release_version="$(bash scripts/installer-version.sh --release)"
          echo "Release version: ${release_version}"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Configure, build and test
        run: |
          # Pre-created so docker does not create them root-owned: the zip step below runs as the
          # unprivileged runner user and must be able to write here.
          mkdir -p build out
          # -Dupdate=OFF as for the Windows and flatpak builds: the update check asks upstream's
          # update.mumble.info, which knows nothing of this fork's releases.
          docker run --rm -v "$PWD":/src -v "$PWD/build":/build -e RELEASE_VERSION mumble-build bash -c '
            set -e
            cmake -S /src -B /build -DCMAKE_BUILD_TYPE=Release -Dtests=ON -Dice=ON -Doverlay-xcompile=OFF \
              -Dupdate=OFF -Drelease-version="${RELEASE_VERSION}"
            cmake --build /build -j"$(nproc)"
            cd /build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure'

      # The protocol core on its own, the way a non-Qt host (the Android app) builds it. Nothing here
      # finds Qt, so this is what proves the core does not need it. Built outside /build so the bundle
      # steps never see it.
      - name: Build and test the protocol core without Qt
        run: |
          docker run --rm -v "$PWD":/src mumble-build bash -c '
            set -e
            cmake -S /src/src/mumble-core -B /tmp/core -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wsign-conversion -Werror"
            cmake --build /tmp/core -j"$(nproc)"
            cd /tmp/core && ctest --output-on-failure'

      - name: Bundle
        run: |
          docker run --rm -v "$PWD":/src -v "$PWD/build":/build -v "$PWD/out":/out mumble-build \
            bash /src/scripts/bundle-linux.sh /build /out/bundle
          cd out && zip -q -r -9 mumble-video-linux-x86_64.zip bundle

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-video-linux-x86_64
          path: out/mumble-video-linux-x86_64.zip

      - name: Stage the server binary
        run: |
          docker run --rm -v "$PWD":/src -v "$PWD/build":/build -v "$PWD/out":/out mumble-build \
            bash /src/scripts/bundle-server.sh /build /out/server
          tar -C out/server -czf out/mumble-video-server-linux-x86_64.tar.gz bin lib

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-video-server-linux-x86_64
          path: out/mumble-video-server-linux-x86_64.tar.gz

      # The deployable server. Built only on pushes to main or a tag - a pull request has nowhere to
      # push and no business publishing an image. Tagged dev-latest for main and the version for a tag,
      # plus the commit sha so any image can be traced back to what produced it.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image tags
        if: github.event_name != 'pull_request'
        id: server_tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          tags="${image}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${image}:dev-latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${image}:${GITHUB_REF_NAME},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push the server image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: out/server
          file: docker/Dockerfile.server
          push: true
          tags: ${{ steps.server_tags.outputs.tags }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build the cross-build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.windows
          tags: mumble-build-windows
          load: true
          cache-from: type=gha,scope=windows-image
          cache-to: type=gha,scope=windows-image,mode=max

      # Before the build, which reports the display version as its own (see the linux job).
      - name: Installer version
        run: |
          read -r msi_version display_version < <(bash scripts/installer-version.sh)
          echo "Installer version: MSI ${msi_version}, shown as ${display_version}"
          echo "MSI_VERSION=${msi_version}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${display_version}" >> "$GITHUB_ENV"

      - name: Cross-compile
        run: |
          mkdir -p build-win out
          docker run --rm -v "$PWD":/src -v "$PWD/build-win":/build -e RELEASE_VERSION mumble-build-windows \
            bash /src/scripts/build-windows.sh

      - name: Bundle and build the installers
        run: |
          docker run --rm -v "$PWD":/src -v "$PWD/build-win":/build -v "$PWD/out":/out \
            -e MSI_VERSION -e DISPLAY_VERSION="${RELEASE_VERSION}" mumble-build-windows bash -c '
            set -e
            bash /src/scripts/bundle-windows.sh /build /out/mumble-windows
            bash /src/scripts/build-msi.sh /out/mumble-windows /out/mumble-video-x64.msi "${MSI_VERSION}"
            bash /src/scripts/build-nsis.sh /out/mumble-windows /out/mumble-video-setup.exe "${DISPLAY_VERSION}"'
          cd out && zip -q -r -9 mumble-video-windows-x86_64.zip mumble-windows

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-video-windows-x86_64
          path: |
            out/mumble-video-setup.exe
            out/mumble-video-x64.msi
            out/mumble-video-windows-x86_64.zip

  flatpak:
    runs-on: ubuntu-latest
    steps:
      # A runner has about 14 GB free, and a full flatpak build needs most of that: the KDE runtime
      # and SDK alone are several GB before Boost, protobuf and Poco are built. The preinstalled
      # toolchains here are worth ~25 GB and none of them are used by this job.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/.ghcup \
                      /usr/share/miniconda /usr/local/share/powershell
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # See the linux job.
      - name: Release version
        run: |
          release_version="$(bash scripts/installer-version.sh --release)"
          echo "Release version: ${release_version}"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Build the flatpak build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.flatpak
          tags: mumble-flatpak-build
          load: true
          cache-from: type=gha,scope=flatpak-image
          cache-to: type=gha,scope=flatpak-image,mode=max

      # No module cache. The one run that built this flatpak successfully was the one with no cache to
      # restore; every run since, with an identical manifest and an identical job, has failed at the
      # build step within seconds of starting. Restoring flatpak-builder's ostree cache through a tar
      # round-trip is the only thing that differed, and a build that takes half an hour is worth more
      # than one that is fast and does not run. Reinstate this once the failure is understood.

      - name: Build the flatpak
        run: |
          mkdir -p flatpak-state out
          df -h /
          # --privileged because flatpak-builder isolates each module with bubblewrap, which cannot
          # set up its namespaces in a default container.
          docker run --rm --privileged \
            -v "$PWD":/src -v "$PWD/flatpak-state":/state -v "$PWD/out":/out -e RELEASE_VERSION \
            mumble-flatpak-build \
            bash /src/scripts/build-flatpak.sh /src /state /out/mumble-video.flatpak
          # The container writes as root; the cache and artifact steps that follow run as the runner
          # user. Reclaiming ownership here is what stops them failing on unreadable files - the same
          # trap that broke the Linux bundle step on the first real CI run.
          sudo chown -R "$(id -u):$(id -g)" flatpak-state out
          # The bundle is built; the exported repository and checkout are just occupying the disk the
          # cache step is about to need.
          sudo rm -rf flatpak-state/build flatpak-state/repo
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-video-flatpak
          path: out/mumble-video.flatpak

  # macOS. This is the one platform the fork had never built in CI, and the gap mattered: the APPLE
  # branch of the client gets the camera and the Cocoa integration but no screen-share capture source
  # (there is no ScreenCaptureKit video source in the tree yet), so the parts that are meant to be
  # cross-platform could regress on macOS with nothing to catch it. This job builds the client, the
  # server and the tests on a real macOS runner and runs the suite, plus the Qt-free protocol core on
  # its own as the other platforms do.
  #
  # It is deliberately NOT in the release job's `needs`: it has not been validated on a runner yet (the
  # fork is developed on Linux and Windows), so a first run that needs a tweak must not be able to hold
  # back a release. Promote it into `needs` once it has gone green, and add a bundling/artifact step
  # then. Honest status, in the spirit of the benchmark workflow's own note: written from the project's
  # documented macOS build (docs/dev/build-instructions/build_macos.md), not yet seen to pass.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The dependencies the project's macOS build instructions list. ice and poco are included so the
      # server's Ice interface builds as it does elsewhere; drop both and add -Dice=OFF below if they
      # prove troublesome on the runner.
      - name: Install dependencies
        run: |
          brew update
          brew install cmake pkg-config qt6 boost libogg libvorbis flac libsndfile protobuf openssl@3 poco ice

      - name: Configure, build and test
        run: |
          # OpenSSL from Homebrew rather than Apple's SecureTransport shim, which the build FAQ warns
          # produces undefined-symbol link errors. overlay and update are off for the same reasons the
          # other packaged builds turn them off: the macOS overlay is a separate component, and the
          # update check points at upstream's server, which knows nothing of this fork.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -Dtests=ON -Dclient=ON -Dserver=ON -Doverlay=OFF -Dupdate=OFF \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt6)"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      # The protocol core on its own, with the same warnings-as-errors the Linux job holds it to. This
      # is where a macOS-specific sign-conversion or alignment warning in the video code would surface -
      # exactly the class of bug the branch already fixed on Linux, where a compiler on a different
      # platform is a second opinion worth having.
      - name: Build and test the protocol core without Qt
        run: |
          cmake -S src/mumble-core -B core -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wsign-conversion -Werror" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build core -j"$(sysctl -n hw.ncpu)"
          cd core && ctest --output-on-failure

  # Two kinds of release. A v* tag publishes a proper versioned release. A push to main rolls the
  # dev-latest prerelease forward, so the Releases page always carries current artifacts without
  # anyone having to tag - CI artifacts expire and are buried behind a login; releases are neither.
  release:
    if: github.event_name != 'pull_request'
    needs: [linux, windows, flatpak]
    runs-on: ubuntu-latest
    permissions:
      # Declaring any permissions sets every unlisted scope to none, so actions:read has to be spelled
      # out - without it this job cannot download the artifacts the other three just uploaded.
      actions: read
      contents: write
    steps:
      # gh rather than actions/download-artifact: the action failed here twice with nothing legible
      # about why, and this prints exactly what it fetched and where it landed, so the next failure is
      # diagnosable from the log instead of by elimination.
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          # Restricted to our own artifacts. docker/build-push-action also uploads a .dockerbuild
          # build record per job, and those three carry identically-named files inside - merging them
          # all into one directory is what has been failing this step since the caching change
          # introduced that action.
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'mumble-video-*' --dir artifacts
          find artifacts -type f -printf '%s\t%p\n'
          # The action's merge-multiple put every artifact's contents in the working directory; the
          # release steps below still expect that layout.
          find artifacts -type f -exec mv -t . {} +
          ls -l mumble-video*

      - name: Checksums
        run: sha256sum mumble-video* > SHA256SUMS

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mumble-video-linux-x86_64.zip
            mumble-video-server-linux-x86_64.tar.gz
            mumble-video.flatpak
            mumble-video-setup.exe
            mumble-video-x64.msi
            mumble-video-windows-x86_64.zip
            SHA256SUMS

      - name: Roll the development release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # The release is never deleted - only its tag is moved and its assets replaced. The old
        # delete+recreate left a window with no dev-latest release at all, and if a second push
        # cancelled this run inside that window (the workflow cancels superseded runs) the release and
        # its tag stayed gone until the next green build - a 404 for anyone downloading meanwhile.
        run: |
          notes="Rolling build of main at $GITHUB_SHA. Prefer a versioned release unless you want the newest changes."
          assets="mumble-video-linux-x86_64.zip mumble-video-server-linux-x86_64.tar.gz mumble-video.flatpak mumble-video-setup.exe mumble-video-x64.msi mumble-video-windows-x86_64.zip SHA256SUMS"

          # Move the dev-latest tag to this commit (create it the first time).
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev-latest" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/dev-latest" -f sha="$GITHUB_SHA"

          # Create the release the first time; afterwards just retarget it and replace its assets in
          # place, so it is never absent.
          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Development build" --notes "$notes"
            # gh's --clobber deletes the old asset before uploading the new one, so each download link
            # was dead for the length of its upload, and for good if a newer push cancelled the run
            # meanwhile. Upload everything beside the old files first, then swap each name in a rename.
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev-latest" --jq .id)
            asset_id() {
              gh api "repos/$GITHUB_REPOSITORY/releases/$release/assets" --paginate \
                --jq ".[] | select(.name == \"$1\") | .id"
            }
            for name in $assets; do ln -f "$name" "next-$name"; done
            gh release upload dev-latest --repo "$GITHUB_REPOSITORY" --clobber $(printf 'next-%s ' $assets)
            for name in $assets; do
              new=$(asset_id "next-$name")
              old=$(asset_id "$name")
              [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new" -f name="$name" > /dev/null
            done
          else
            gh release create dev-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Development build" --notes "$notes" $assets
          fi
